name: Build MLB slate

on:
  push:
    branches: [main]
    # Deploy source fixes immediately. The bot's generated data-only commits
    # do not match these paths, so they cannot create a workflow loop.
    paths:
      - ".github/workflows/build.yml"
      - "pipeline/**"
      - "scripts/**"
      - "tests/**"
      - "docs/*.js"
      - "docs/*.html"
      - "docs/*.css"
      - "requirements.txt"
  schedule:
    # UTC. Covers the whole MLB day: morning card, midday line moves, the
    # window when lineups post, first pitch, late west-coast games, and an
    # overnight pass that grades everything that finished.
    - cron: "0 11 * * *"    #  7:00 AM ET  - first build of the day
    - cron: "0 15 * * *"    # 11:00 AM ET
    - cron: "0 18 * * *"    #  2:00 PM ET
    - cron: "30 20 * * *"   #  4:30 PM ET  - lineups start posting
    - cron: "0 22 * * *"    #  6:00 PM ET  - close to first pitch
    - cron: "30 23 * * *"   #  7:30 PM ET
    - cron: "0 2 * * *"     # 10:00 PM ET  - late slate
    # The gap between the late build and the morning one used to run six hours,
    # so anyone opening the page in the small hours found the newest slate was
    # still yesterday's and the Today button appeared to go backwards.
    - cron: "20 4 * * *"    # 12:20 AM ET  - build the new day as soon as it starts
    - cron: "0 8 * * *"     #  4:00 AM ET  - grade yesterday, rebuild
  workflow_dispatch:
    inputs:
      date:
        description: "Slate date (YYYY-MM-DD, blank = today)"
        required: false
      days:
        description: "How many days to build (blank = the config default)"
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: mlb-edge
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore upstream cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: mlb-cache-${{ github.run_id }}
          restore-keys: mlb-cache-

      - name: Self-test (pipeline)
        run: python -m tests.test_pipeline

      - name: Self-test (dashboard ledger)
        run: node tests/test_ledger.mjs

      - name: Self-test (date resolution)
        run: node tests/test_schedule.mjs

      - name: Self-test (scheduled build runner)
        run: bash tests/test_build_runner.sh

      - name: Self-test (browser simulator matches the build engine)
        run: node tests/test_sim.mjs docs/data || true

      - name: Build slate
        env:
          MLB_BANKROLL: ${{ vars.MLB_BANKROLL || '250' }}
          MLB_SEASON: ${{ vars.MLB_SEASON || '2026' }}
          # These are blank on a scheduled/push run. Keeping the GitHub
          # expression out of the shell command prevents an empty or malformed
          # dispatch value from changing how bash parses the command.
          BUILD_DATE: ${{ inputs.date }}
          BUILD_DAYS: ${{ inputs.days }}
        run: bash scripts/run_build.sh

      # Do not run a second build for yesterday here. pipeline.build already
      # grades every finished date in the ledgers. A second build also replaces
      # index.json/latest.json with yesterday, making the live site go backward.

      - name: Commit feed, ledger and prediction history
        run: |
          git config user.name  "mlb-edge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A docs/data data/shadow.json data/predictions.json
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            git commit -m "slate: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
